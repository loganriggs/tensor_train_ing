# Width-exponent fit: does the optimal *base* LR stay put across widths under width_scaling_base (exponent 0.5)?
# Width-scaled 12-layer models at 512/1024/2048 on a sqrt(2)-spaced LR grid; combined with the existing 4.5e-4 / 1.35e-3 points
# (confirmation + width2048 sweeps) gives 5 LRs per width. Same data/protocol/retention.
project:
  total_budget_usd: 1000
  reserve_usd: 150
  dry_run: false
  spend_ledger: /workspace/tensor_train_ing/runs/exponent_fit/spend.json
  stage: C
  gpu_hourly_rate_usd: 0.4219
  milestone_tokens: []
  keep_recovery_checkpoints: 0
  save_initial_checkpoint: false
model:
  layers: 12
  d_model: 512
  heads: 8
  d_key: 64
  d_value: 64
  d_mlp: 1664
  padded_vocab: 50304
  mlp: bilinear
  attention: signed_product
  normalization: pre_rms
  final_normalization: rms
  loss_chunk_tokens: 4096
  activation_checkpointing: false
  width_scaling_base: 512
data:
  manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  context: 512
  micro_batch_size: 16
evaluation:
  validation_manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  seed: 0
train:
  # QK-clip adopted as the scale-up default (2026-10-17 23:30). Idle at <= base LR at 1B; prevents high-LR divergence that would
  # otherwise corrupt the optimum-LR fit. Existing 4.5e-4/1.35e-3 seed-101 points: clip changes them by -0.002/-0.004.
  qk_clip_tau: 100.0
  qk_clip_every_steps: 50
  deterministic: false
  optimizer: adamw
  lr: 0.00045
  global_prediction_tokens_per_update: 8192
  rung_total_tokens: 50003968
  schedule: constant_with_separate_cooldown
  cooldown_fraction: 0.1
  compile: true
  seed: 101
  stability_every_steps: 500
