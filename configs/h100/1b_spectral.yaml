# H100 run, 1.4B (24x2048), Chinchilla ~20 tokens/param = 28B tokens. Built 2026-10-18 from today's measurements:
# - LR (revised 04:00 Oct 19): horizon rule -> ~3.5e-4 at 28B (width 512, 8k batch); exponent fit: under width_scaling_base the optimal
#   base LR still drifts as width^-0.39 (512: 7.4e-4, 1024: 5.6e-4, 2048: 4.3e-4) -> x(2048/512)^-0.39 = 0.58; critical batch: ~x2 at
#   128k-256k tokens/update -> lr 4e-4. UNCERTAIN: run the day-1 LR bracket {3e-4, 4e-4, 5.5e-4} for ~1B tokens each, keep the best.
# - Batch 262144 tokens/update: within the measured no-penalty range (>=128k).
# - Sparse log-spaced milestones (1B, 2B, 4B, ...) + 2 rolling recovery states; final + 90% branch kept.
# Fill in on day 1: project.gpu_hourly_rate_usd, data.manifest / evaluation.validation_manifest (28B prep).
# Variant B: spectral_rms, no QK-clip (incompatible). Ties pre_rms at 1B base LR, far larger LR margin, 3.7x lower ablation
# distortion; re-measure its throughput on H100 (output-scaled SpectralLinear, ~4% CPU-proxy overhead after the fix).
data:
  context: 2048
  manifest: REQUIRED_IMMUTABLE_MANIFEST
  micro_batch_size: 4
evaluation:
  seed: 0
  validation_manifest: REQUIRED_VALIDATION_MANIFEST
model:
  activation_checkpointing: true
  d_key: 128
  d_mlp: 4096
  d_model: 2048
  d_value: 128
  depth_residual_base: 12
  heads: 16
  layers: 24
  loss_chunk_tokens: 4096
  width_scaling_base: 512
  normalization: spectral_rms
project:
  dry_run: true
  gpu_hourly_rate_usd: REQUIRED_ACTUAL_RATE
  keep_recovery_checkpoints: 2
  milestone_tokens:
  - 1000000000
  - 2000000000
  - 4000000000
  - 8000000000
  - 16000000000
  - 32000000000
  - 64000000000
  - 128000000000
  - 256000000000
  - 512000000000
  reserve_usd: 150
  spend_ledger: runs/pilot_1b/spend.json
  stage: D
  total_budget_usd: 1000
train:
  compile: false   # tnlm/distributed_train.py rejects compile ("compile is unsupported"); throughput penalty vs compiled is UNMEASURED (red-team D1)
  deterministic: false
  global_prediction_tokens_per_update: 261120  # = 4 rounds x 8 ranks x 8160. Each round, every rank draws one 4x2048 micro-batch
  # (>= 8167 targets measured); 262144 needed a 5th round that was ~99% discarded (1.25x data read). Redo if the GPU count is not 8.
  lr: 0.0004
  optimizer: adamw
  qk_clip_every_steps: 0
  qk_clip_tau: 0.0
  rung_total_tokens: 28000000000
  seed: 101
