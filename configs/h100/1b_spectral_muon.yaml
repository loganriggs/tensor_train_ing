# H100 run, variant C: Muon (spectral) + spectral_rms, 1.4B (24x2048), ~28B tokens. Drafted 06:50 Oct 20; LR PROVISIONAL until lr_horizon2 (~08:50).
# Why Muon: -0.14/-0.15/-0.11 vs the best AdamW at 100M/300M/1B (8k batch, 50M tokens, 1-2 seeds); -0.044 at 131k tokens/update with both LRs
#   bracketed (docs/scaling.md). Needs no QK-clip (attention scores stay small: max |S1*S2| 270 at 1B), so it is NOT blocked by the
#   distributed trainer's missing QK-clip (red-team D1). Newton-Schulz overhead ~2% at this batch (measured).
# Why spectral_rms: the user's leaning (B); Muon x spectral tied Muon x pre_rms at 100M (1 seed); B is robust at 3x LR without QK-clip.
# LR: 8.9e-3 = Muon optimum at 131k tokens/update, 200M tokens, 101M params; x (28B/200M)^-0.10 = 0.61 (horizon rule; re-fit by lr_horizon2);
#   x ~1.26 for 131k -> 261k (Muon's measured batch scaling, 8k->131k: x2.5 for 16x). Muon LR ~flat across width (512->2048).
#   UNTESTED: depth 24 for Muon. Day-1 bracket {4e-3, 6e-3, 9e-3} for ~1B tokens each; keep the best.
data:
  context: 2048
  manifest: REQUIRED_IMMUTABLE_MANIFEST
  micro_batch_size: 4
evaluation:
  seed: 0
  validation_manifest: REQUIRED_VALIDATION_MANIFEST
model:
  activation_checkpointing: true
  d_key: 128
  d_mlp: 4096
  d_model: 2048
  d_value: 128
  depth_residual_base: 12
  heads: 16
  layers: 24
  loss_chunk_tokens: 4096
  width_scaling_base: null   # Muon does its own (spectral) shape scaling; make_optimizer rejects Muon + width scaling
  normalization: spectral_rms
project:
  dry_run: true
  gpu_hourly_rate_usd: REQUIRED_ACTUAL_RATE
  keep_recovery_checkpoints: 2
  milestone_tokens:
  - 1000000000
  - 2000000000
  - 4000000000
  - 8000000000
  - 16000000000
  - 32000000000
  - 64000000000
  - 128000000000
  - 256000000000
  - 512000000000
  reserve_usd: 150
  spend_ledger: runs/pilot_1b/spend.json
  stage: D
  total_budget_usd: 1000
train:
  compile: false   # tnlm/distributed_train.py rejects compile ("compile is unsupported"); throughput penalty vs compiled is UNMEASURED (red-team D1)
  deterministic: false
  global_prediction_tokens_per_update: 261120  # = 4 rounds x 8 ranks x 8160. Each round, every rank draws one 4x2048 micro-batch
  # (>= 8167 targets measured); 262144 needed a 5th round that was ~99% discarded (1.25x data read). Redo if the GPU count is not 8.
  lr: 0.006   # PROVISIONAL (see header): 8.9e-3 (131k batch, 200M tokens, 100M) x horizon 0.61 x batch 1.26
  optimizer: muon
  muon_adjust_lr: spectral_unclamped
  aux_adamw_lr: 0.00045   # embeddings/gains: fixed in every Muon experiment (untuned; red-team C3)
  qk_clip_every_steps: 0
  qk_clip_tau: 0.0
  rung_total_tokens: 28000000000
  seed: 101
