# Joint width x depth rule at 50M cooled tokens (pilot-only before): 24 x 1024 (~504M) default vs
# width_scaling_base 512 + depth_residual_base 12, against the 12 x 512 confirmation baseline. Same data/protocol.
# Screening retention (19:20): seed-202 candidates were refused at 73 GB staged with default retention.
project:
  total_budget_usd: 1000
  reserve_usd: 150
  dry_run: false
  spend_ledger: /workspace/tensor_train_ing/runs/joint50m/spend.json
  stage: C
  gpu_hourly_rate_usd: 0.4219
  milestone_tokens: []
  keep_recovery_checkpoints: 0
  save_initial_checkpoint: false
model:
  layers: 24
  d_model: 1024
  heads: 16
  d_key: 64
  d_value: 64
  d_mlp: 3392
  padded_vocab: 50304
  mlp: bilinear
  attention: signed_product
  normalization: pre_rms
  final_normalization: rms
  loss_chunk_tokens: 4096
data:
  manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  context: 512
  micro_batch_size: 16
evaluation:
  validation_manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  seed: 0
train:
  deterministic: false
  optimizer: adamw
  lr: 0.00045
  global_prediction_tokens_per_update: 8192
  rung_total_tokens: 50003968
  schedule: constant_with_separate_cooldown
  cooldown_fraction: 0.1
  compile: true
  seed: 101
  stability_every_steps: 500
