# RED-TEAM 22:40 Oct 19: redo of lr_horizon's 300M-token points. The originals read 1.89 epochs of the 320M set (8192-target quota -> 1.96x
# input), so they trained on ~half-repeated data. That rule (LR_opt ~ D^-0.10) sets the H100 LR. Same model/protocol, 13B set, 8160 quota.
# Optimal-LR shift with training length (scaling_review rec. 4): 12x512 at 50M vs 300M cooled tokens on a sqrt(2)-spaced LR grid.
# Same data/protocol as configs/confirmation/ (300M = one epoch of the 310.6M-token train split). Screening retention.
project:
  total_budget_usd: 1000
  reserve_usd: 150
  dry_run: false
  spend_ledger: /workspace/tensor_train_ing/runs/lr_horizon2/spend.json
  stage: C
  gpu_hourly_rate_usd: 0.4219
  milestone_tokens: []
  keep_recovery_checkpoints: 0
  save_initial_checkpoint: false
model:
  layers: 12
  d_model: 512
  heads: 8
  d_key: 64
  d_value: 64
  d_mlp: 1664
  padded_vocab: 50304
  mlp: bilinear
  attention: signed_product
  normalization: pre_rms
  final_normalization: rms
  loss_chunk_tokens: 4096
data:
  manifest: /workspace/tensor_train_ing/data/fineweb_13b_heldout/manifest.json
  context: 512
  micro_batch_size: 16
evaluation:
  validation_manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  seed: 0
train:
  deterministic: false
  optimizer: adamw
  lr: 0.00045
  global_prediction_tokens_per_update: 8160
  rung_total_tokens: 50003968
  schedule: constant_with_separate_cooldown
  cooldown_fraction: 0.1
  compile: true
  seed: 101
  stability_every_steps: 500
