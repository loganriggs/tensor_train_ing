# lagged arms removed 03:50 Oct 18: at 12x512 on real data the lagged model gives a non-finite loss on step 1 (polynomial attention
# outliers dominate the shared divisor; see docs/scaling.md 'Polynomial normalization canaries'). They return once a fixed variant passes
# scripts/norm_canary.py. Removing them also keeps a step-1 failure from halting the queue.
