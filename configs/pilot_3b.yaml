# pilot_3b: 2.81B matrix params, parameter-matched polynomial preset (tnlm.shapes).
# Memory plan (tnlm.shapes.min_gpus, checkpointing, 8192 tok/GPU): >= 1 x 80GB, ~57.9 GB/GPU.
# Launch: torchrun --nproc-per-node <G> -m tnlm.cli train --distributed --config pilot_3b.yaml ...
# lr 4.5e-4 is the base LR at width 512. width_scaling_base: 512 scales hidden LR by (512/d)^0.5, which is supported by
# the 512->1024 transfer sweep. depth_residual_base: 12 (branch x 12/L) is supported by the 12->24-layer sweep (docs/scaling.md). global_prediction_tokens_per_update and beta2 at this batch are NOT
# transfer-validated: confirm with a short LR x batch check at the pilot scale before committing budget.
project:
  total_budget_usd: 1000
  reserve_usd: 150
  dry_run: true
  spend_ledger: runs/pilot_3b/spend.json
  stage: D
  gpu_hourly_rate_usd: REQUIRED_ACTUAL_RATE
  # Long-run retention (2026-10-18): the default keeps a full state every 100M tokens forever (286 states, ~4.7 TB, for a 28B-token
  # 1.4B run). Instead: log-spaced permanent milestones (entries past the run length are ignored) plus the final and 90% branch
  # states, and 2 rolling time-based recovery states for crash resume.
  milestone_tokens: [1000000000, 2000000000, 4000000000, 8000000000, 16000000000, 32000000000, 64000000000, 128000000000, 256000000000, 512000000000]
  keep_recovery_checkpoints: 2
model:
  layers: 32
  d_model: 2560
  heads: 20
  d_key: 128
  d_value: 128
  d_mlp: 5248
  activation_checkpointing: true
  loss_chunk_tokens: 4096
  width_scaling_base: 512
  depth_residual_base: 12
data:
  manifest: REQUIRED_IMMUTABLE_MANIFEST
  context: 2048
  micro_batch_size: 4
evaluation:
  validation_manifest: REQUIRED_VALIDATION_MANIFEST
  seed: 0
train:
  # QK-clip (tnlm.qk_clip; docs/scaling.md "QK-clip at 1B"): idle at the base LR (0 clips in 122 checks at 1B), rescues
  # attention-score divergence at high LR (1B seed 202: 5.657 -> 4.966) and costs nothing when unneeded (-0.004).
  qk_clip_tau: 100.0
  qk_clip_every_steps: 50
  deterministic: false   # true only for bitwise-replay references / interpretability-critical reruns (-14% throughput)
  optimizer: adamw
  # Base LR at width 512; width scaling applies (512/w)^0.5. Set it for the chosen rung_total_tokens D with the measured horizon rule
  # LR_opt(D) ~= 5.7e-4 * (D / 3e8)^-0.10 (docs/scaling.md "LR vs token horizon"): ~4.7e-4 at 2B, ~3.9e-4 at 10B, ~3.5e-4 at 28B.
  lr: 0.00045
  global_prediction_tokens_per_update: 524288
  rung_total_tokens: REQUIRED
  compile: true
  seed: 101
