# Second seed (101) for spectral_rms at 1B, both LRs. It also measures GPU throughput after the output-scaled SpectralLinear forward
# (the 11% overhead was measured before that change). Compare with width2048 w2048ws_*_s101 (pre_rms) and qkclip1b *_s101.
# spectral_rms at 1B (12x2048, width-scaled): it has no QK-clip (incompatible), so does sigmaReparam alone prevent the high-LR divergence
# that broke unclipped pre_rms on seed 202 (5.657; QK-clip fixed it at 4.966)? Same data/protocol as width2048/qkclip1b.
project:
  total_budget_usd: 1000
  reserve_usd: 150
  dry_run: false
  spend_ledger: /workspace/tensor_train_ing/runs/spectral1b_s101/spend.json
  stage: C
  gpu_hourly_rate_usd: 0.4219
  milestone_tokens: []
  keep_recovery_checkpoints: 0
  save_initial_checkpoint: false
model:
  layers: 12
  d_model: 2048
  heads: 32
  d_key: 64
  d_value: 64
  d_mlp: 6784
  padded_vocab: 50304
  mlp: bilinear
  attention: signed_product
  normalization: spectral_rms
  final_normalization: rms
  loss_chunk_tokens: 4096
  activation_checkpointing: true
  width_scaling_base: 512
data:
  manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  context: 512
  micro_batch_size: 16
evaluation:
  validation_manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  seed: 0
train:
  deterministic: false
  optimizer: adamw
  lr: 0.00045
  global_prediction_tokens_per_update: 8192
  rung_total_tokens: 50003968
  schedule: constant_with_separate_cooldown
  cooldown_fraction: 0.1
  compile: true
  seed: 101
  stability_every_steps: 500
  qk_clip_tau: 0.0
  qk_clip_every_steps: 0
