# Width 2048 (12 layers, ~1.0B params) confirmation at 50M cooled tokens: is the width-scaling rule valid over a 4x
# width ratio (512 -> 2048)? Same data/protocol as configs/confirmation/. Activation checkpointing (exact) to fit 32 GB.
# Screening retention: no recovery copies, no initial save (crash = rerun); ~40 GB staged per candidate.
project:
  total_budget_usd: 1000
  reserve_usd: 150
  dry_run: false
  spend_ledger: /workspace/tensor_train_ing/runs/width2048/spend.json
  stage: C
  gpu_hourly_rate_usd: 0.4219
  milestone_tokens: []
  keep_recovery_checkpoints: 0
  save_initial_checkpoint: false
model:
  layers: 12
  d_model: 2048
  heads: 32
  d_key: 64
  d_value: 64
  d_mlp: 6784
  padded_vocab: 50304
  mlp: bilinear
  attention: signed_product
  normalization: pre_rms
  final_normalization: rms
  loss_chunk_tokens: 4096
  activation_checkpointing: true
data:
  manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  context: 512
  micro_batch_size: 16
evaluation:
  validation_manifest: /workspace/tensor_train_ing/data/fineweb_confirmation_320m/manifest.json
  seed: 0
train:
  deterministic: false
  optimizer: adamw
  lr: 0.00045
  global_prediction_tokens_per_update: 8192
  rung_total_tokens: 50003968
  schedule: constant_with_separate_cooldown
  cooldown_fraction: 0.1
  compile: true
  seed: 101
  stability_every_steps: 500
