[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tnlm"
version = "0.1.0"
description = "Tensor-network (bilinear / polynomial-attention) language model experiment platform"
requires-python = ">=3.11"
# Exact versions verified on the reference box (RTX 5000 Ada, CUDA 13.0); checkpoints also record them.
dependencies = [
  "torch==2.14.1",
  "triton==3.8.0",
  "numpy==2.5.4",
  "PyYAML==6.0.3",
  "tiktoken==0.14.0",
  "pyarrow==26.0.0",
  "matplotlib==3.11.2",
  "huggingface_hub==1.30.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0"]

[project.scripts]
tnlm = "tnlm.cli:main"

[tool.setuptools.packages.find]
include = ["tnlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
